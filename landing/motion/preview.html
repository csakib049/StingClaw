<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0e">
  <title>StingClaw — Agent chat preview</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; background: #0b0b0e; color: #f5f2f3; }
    * { box-sizing: border-box; }
    body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: clamp(20px, 5vw, 72px); background: radial-gradient(70% 80% at 50% 0%, #31141e 0%, #151115 40%, #0b0b0e 78%); }
    main { width: min(100%, 1240px); }
    .eyebrow { margin: 0 0 12px; color: #ff829d; font: 600 12px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0 0 28px; font-size: clamp(26px, 4vw, 44px); line-height: 1.08; letter-spacing: -.04em; font-weight: 560; }
    .screen { overflow: hidden; border: 1px solid #3c3036; border-radius: 14px; background: #08080a; box-shadow: 0 32px 100px #0009, 0 0 90px #ef3c6918; }
    video { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; }
    .caption { margin: 16px 2px 0; color: #a9a1a5; font-size: 13px; line-height: 1.5; }
    @media (prefers-reduced-motion: reduce) { video { object-fit: contain; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">StingClaw · product preview</p>
    <h1>A real agent conversation, in motion.</h1>
    <div class="screen">
      <video autoplay muted playsinline loop preload="auto" poster="./agentChat-poster.jpg" aria-label="15-second preview of an agent conversation">
        <source src="./agentChat-15s.mp4" type="video/mp4">
      </video>
    </div>
    <p class="caption">Autoplays silently and loops. The clip is cropped to the app window and sized for a landing-page hero.</p>
  </main>
</body>
</html>
